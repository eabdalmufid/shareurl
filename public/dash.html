<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ShareURL</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Mobile-first approach - base styles for mobile */
        .login-container {
            max-width: 400px;
            margin: 2rem auto;
            padding: 1rem;
        }
        
        .login-card {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-lg);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: var(--spacing-lg);
        }
        
        .login-header h1 {
            font-size: 1.25rem;
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
        }
        
        .login-header p {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }
        
        .key-input {
            width: 100%;
            padding: var(--spacing-md) var(--spacing-lg);
            font-size: 1rem;
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: var(--spacing-md);
        }
        
        .key-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .dashboard-hidden {
            display: none;
        }
        
        .dashboard-header {
            text-align: center;
            margin-bottom: var(--spacing-lg);
            padding: var(--spacing-sm) 0;
        }
        
        .dashboard-header h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: var(--spacing-sm);
        }
        
        .logout-btn {
            padding: var(--spacing-xs) var(--spacing-md);
            background: var(--error);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.8rem;
            margin-top: var(--spacing-xs);
        }
        
        .logout-btn:hover {
            opacity: 0.8;
        }
        
        .section-header {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
            margin-bottom: var(--spacing-md);
        }
        
        .section-header h2 {
            font-size: 1.125rem;
            color: var(--text-primary);
        }
        
        .admin-section {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: var(--spacing-md);
            box-shadow: var(--shadow-md);
            margin-bottom: var(--spacing-lg);
        }
        
        .admin-section h2 {
            font-size: 1.125rem;
            margin-bottom: var(--spacing-md);
        }
        
        .item-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }
        
        .no-items {
            text-align: center;
            color: var(--text-secondary);
            padding: var(--spacing-lg);
            background: var(--bg-main);
            border-radius: var(--radius-lg);
            border: 2px dashed var(--border);
            font-size: 0.875rem;
        }
        
        /* Tablet and up */
        @media (min-width: 641px) {
            .login-container {
                margin: 100px auto;
                padding: 2rem;
            }
            
            .login-card {
                padding: var(--spacing-xl);
            }
            
            .login-header h1 {
                font-size: 1.5rem;
            }
            
            .login-header p {
                font-size: 0.875rem;
            }
            
            .dashboard-header {
                margin-bottom: var(--spacing-xl);
            }
            
            .dashboard-header h1 {
                font-size: 2rem;
            }
            
            .logout-btn {
                font-size: 0.875rem;
            }
            
            .section-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                margin-bottom: var(--spacing-lg);
            }
            
            .section-header h2 {
                font-size: 1.5rem;
            }
            
            .admin-section {
                padding: var(--spacing-xl);
                border-radius: var(--radius-xl);
                margin-bottom: var(--spacing-xl);
            }
            
            .admin-section h2 {
                font-size: 1.5rem;
            }
            
            .item-list {
                gap: var(--spacing-md);
            }
            
            .no-items {
                padding: var(--spacing-xl);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Section -->
        <div id="loginSection" class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <h1>🔐 Admin Login</h1>
                    <p>Enter your admin key to access the dashboard</p>
                </div>
                <form id="loginForm">
                    <input 
                        type="password" 
                        id="keyInput" 
                        class="key-input"
                        placeholder="Enter admin key..."
                        required
                        autocomplete="off"
                    >
                    <button type="submit" class="btn-primary">
                        <span class="btn-text">Login</span>
                    </button>
                </form>
                <div id="loginError" class="error-section" style="display: none; margin-top: var(--spacing-md);">
                    <div class="error-card">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="12" r="10" stroke-width="2"/>
                            <line x1="12" y1="8" x2="12" y2="12" stroke-width="2" stroke-linecap="round"/>
                            <line x1="12" y1="16" x2="12.01" y2="16" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <span id="loginErrorMessage"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboardSection" class="dashboard-hidden">
            <div class="dashboard-header">
                <h1>📊 Admin Dashboard</h1>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>

            <!-- Statistics Section -->
            <section class="admin-section">
                <h2>📊 Statistics</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="adminTotalUrls">0</div>
                        <div class="stat-label">Short URLs</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="adminTotalFiles">0</div>
                        <div class="stat-label">Upload Files</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="adminTotalClicks">0</div>
                        <div class="stat-label">Total Clicks</div>
                    </div>
                </div>
            </section>

            <!-- Recent Short URLs -->
            <section class="admin-section">
                <div class="section-header">
                    <h2>🔗 Recent Short URLs</h2>
                </div>
                <div id="recentUrls" class="item-list">
                    <p class="no-items">No URLs found</p>
                </div>
            </section>

            <!-- Recent Upload Files -->
            <section class="admin-section">
                <div class="section-header">
                    <h2>📁 Recent Upload Files</h2>
                </div>
                <div id="recentFiles" class="item-list">
                    <p class="no-items">No files found</p>
                </div>
            </section>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>Powered by Affidev</p>
        </footer>
    </div>

    <script src="dash.js"></script>
</body>
</html>
